name: 'SHAPELIVE DAY (start ~08:40 IST: WRU + ENG before the open -> hand-over 11:20 -> BPB at 12:00 -> manager to 15:45)'

# Start it ONCE per day with cron-job.org at 08:40 IST (Mon-Fri).  This ONE workflow replaces BOTH shape_live_wru.yml (08:40) and shape_live_manager.yml (11:30) - remove those two cron jobs,
# otherwise two managers would look after the same account at the same time.
# Why one workflow: the ENG trades run until 15:30, so the morning job and the BPB job cannot be separate managers (they would cancel each other's orders), and a single GitHub job may not run
# longer than 6 hours (08:40 -> 15:45 is 7 h).  So there are two jobs, one after the other, and ONE manager at any time:
#   job 'morning'  08:40  plan WRU + ENG (alerts at once)  ->  manager until HANDOVER_AT (11:20), quiet hand-over, plan.json is passed on as an artifact
#   job 'day'      11:21  plan BPB (scan, alerts at ALERT_AT 12:00; merged into today's plan.json)  ->  manager until 15:45 for WRU + ENG + BPB (ENG square-off 15:30, BPB square-off 15:30)
# The manager keeps no state of its own: job 'day' rebuilds everything from Kite (orders, positions, alerts) and the plan file.
# A failed plan step is retried once (continue-on-error + retry step).  The manager deletes any waiting SHP| alert when there is no plan for today.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = normal day | cleanup = delete all waiting SHP| alerts right now | iptest = check the static IP (places nothing)'
        required: false
        default: 'run'
      dry_run:
        description: '1 = print the plan and the orders, create/send nothing'
        required: false
        default: '0'
      capital_pct:
        description: 'Each trade of WRU / ENG / BPB may use this percent of the funds available in your Kite account (default 7)'
        required: false
        default: '7'
      eng_max_open:
        description: 'ENG: the most trades open at the same time'
        required: false
        default: '3'
      bpb_max_open:
        description: 'BPB: the most trades open at the same time'
        required: false
        default: '2'
      min_price:
        description: 'Options priced at or below this many rupees are not traded (Rs 5 = a Rs 5.00 option is excluded)'
        required: false
        default: '5'
      alert_at:
        description: 'BPB: time its ATO alerts are created (the untouched-since-open check is made at this second)'
        required: false
        default: '12:00:00'
      handover_at:
        description: 'The morning job stops its manager at this time and the day job takes over (must be before 11:25 so that the BPB scan can finish before ALERT_AT)'
        required: false
        default: '11:20:00'
      total_funds:
        description: 'OPTIONAL total funds in rupees: trades are sized on this instead of the funds available in Kite (blank = use Kite)'
        required: false
        default: ''
      max_cost:
        description: 'OPTIONAL fixed rupee cap per trade. Leave empty to use the percentage above'
        required: false
        default: ''
      fund_limit_pct:
        description: '0 = no fund limit (default).  30 = no new orders while the account uses more than 30 percent of the total funds'
        required: false
        default: '0'
      sweep_all:
        description: '0 (default) = only the options of the plan + SHP orders | 1 = after the last strategy also clear EVERY open NFO position and waiting NFO order of the account'
        required: false
        default: '0'
      buy_chase:
        description: '1 (default) = a waiting BUY is first modified to a marketable limit price (BPB +10 percent / 1 s, WRU and ENG +5 percent / 0.5 s), then cancelled. 0 = cancel it at once (old behaviour)'
        required: false
        default: '1'
      force:
        description: '0 (default). 1 = allow the plan outside the normal window (weekend / after 15:00)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: shapelive-kite-manager
  cancel-in-progress: false

jobs:
  morning:
    name: 'morning: plan WRU + ENG -> manager to hand-over'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
      KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
      ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
      ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
      ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
      ORDER_PROXY: ${{ secrets.ORDER_PROXY }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
      MAX_COST: ${{ github.event.inputs.max_cost }}
      FORCE: ${{ github.event.inputs.force }}
      MIN_PRICE: ${{ github.event.inputs.min_price || '5' }}
      PLAN_MERGE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp pandas numpy

      - name: Plan WRU + ENG - scan, create ATO alerts at once
        id: plan
        continue-on-error: true      # a failed first attempt does not fail the job - the retry below decides
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'run' }}
        env:
          STRATEGIES: 'WRU,ENG'
          WRU_CAPITAL_PCT: ${{ github.event.inputs.capital_pct || '7' }}
          ENG_CAPITAL_PCT: ${{ github.event.inputs.capital_pct || '7' }}
          ENG_MAX_OPEN: ${{ github.event.inputs.eng_max_open || '3' }}
        run: python -u shape_live_plan.py plan

      - name: Plan WRU + ENG RETRY (only if the first attempt failed)
        id: plan_retry
        if: ${{ steps.plan.outcome == 'failure' && (github.event.inputs.mode == '' || github.event.inputs.mode == 'run') }}
        env:
          STRATEGIES: 'WRU,ENG'
          WRU_CAPITAL_PCT: ${{ github.event.inputs.capital_pct || '7' }}
          ENG_CAPITAL_PCT: ${{ github.event.inputs.capital_pct || '7' }}
          ENG_MAX_OPEN: ${{ github.event.inputs.eng_max_open || '3' }}
        run: python -u shape_live_plan.py plan

      - name: Manager (WRU + ENG) until the hand-over
        # runs even if the plan failed twice: with no plan for today the manager deletes any waiting SHP| alert and stops
        if: ${{ !cancelled() }}
        env:
          FUND_LIMIT_PCT: ${{ github.event.inputs.fund_limit_pct }}
          SWEEP_ALL: ${{ github.event.inputs.sweep_all }}
          BUY_CHASE: ${{ github.event.inputs.buy_chase || '1' }}
          PLAN_FILE: ${{ github.event.inputs.dry_run == '1' && 'live_plan/preview.json' || 'live_plan/plan.json' }}
          JOB_END: ${{ github.event.inputs.handover_at || '11:20:00' }}
        run: python -u shape_live_manager.py ${{ github.event.inputs.mode || 'run' }}

      - name: Pass the plan on to the day job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live_plan
          path: |
            live_plan/plan.json
            live_plan/preview.json
          if-no-files-found: ignore
          overwrite: true

  day:
    name: 'day: plan BPB (alerts at 12:00) -> manager to 15:45'
    needs: morning
    if: ${{ !cancelled() }}                  # also when the morning job failed - the BPB part and the clean-up must still run
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
      KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
      ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
      ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
      ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
      ORDER_PROXY: ${{ secrets.ORDER_PROXY }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
      MAX_COST: ${{ github.event.inputs.max_cost }}
      FORCE: ${{ github.event.inputs.force }}
      MIN_PRICE: ${{ github.event.inputs.min_price || '5' }}
      PLAN_MERGE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp pandas numpy

      - name: Get the morning plan (WRU + ENG items)
        continue-on-error: true      # no artifact = the morning plan step never wrote one: the BPB plan then starts a new plan.json
        uses: actions/download-artifact@v4
        with:
          name: live_plan
          path: live_plan

      - name: Plan BPB - scan, drop touched setups, create ATO alerts at 12:00 (merged into today's plan)
        id: plan
        continue-on-error: true
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'run' }}
        env:
          STRATEGIES: 'BPB'
          BPB_CAPITAL_PCT: ${{ github.event.inputs.capital_pct || '7' }}
          BPB_MAX_OPEN: ${{ github.event.inputs.bpb_max_open || '2' }}
          ALERT_AT: ${{ github.event.inputs.alert_at || '12:00:00' }}
        run: python -u shape_live_plan.py plan

      - name: Plan BPB RETRY (only if the first attempt failed)
        id: plan_retry
        if: ${{ steps.plan.outcome == 'failure' && (github.event.inputs.mode == '' || github.event.inputs.mode == 'run') }}
        env:
          STRATEGIES: 'BPB'
          BPB_CAPITAL_PCT: ${{ github.event.inputs.capital_pct || '7' }}
          BPB_MAX_OPEN: ${{ github.event.inputs.bpb_max_open || '2' }}
          ALERT_AT: ${{ github.event.inputs.alert_at || '12:00:00' }}
        run: python -u shape_live_plan.py plan

      - name: Manager (WRU + ENG + BPB) - entries, targets, exits, 15:30 square-off, open-trade limits
        # runs even if the BPB plan failed: ENG positions from the morning still need their 15:30 exit
        if: ${{ !cancelled() }}
        env:
          FUND_LIMIT_PCT: ${{ github.event.inputs.fund_limit_pct }}
          SWEEP_ALL: ${{ github.event.inputs.sweep_all }}
          BUY_CHASE: ${{ github.event.inputs.buy_chase || '1' }}
          PLAN_FILE: ${{ github.event.inputs.dry_run == '1' && 'live_plan/preview.json' || 'live_plan/plan.json' }}
          JOB_END: '15:45:00'
        run: python -u shape_live_manager.py ${{ github.event.inputs.mode || 'run' }}
