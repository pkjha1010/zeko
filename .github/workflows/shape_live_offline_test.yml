name: SHAPELIVE offline test (simulated Zerodha - no login, no orders)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shapelive-offline-test
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp

      - name: Run offline test (fake clock, fake exchange)
        run: python -u shape_live_offline_test.py
