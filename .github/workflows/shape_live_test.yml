name: SHAPELIVE test (1 lot - proxy / order check)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'iptest = IP check only (places nothing) | cancel = far-below limit BUY, auto-cancelled | roundtrip = BUY 1 lot, hold, SELL'
        required: true
        default: 'iptest'
      option:
        description: 'Option symbol, e.g. OIL26OCT445PE (empty = first option of live_plan/plan.json)'
        required: false
        default: ''
      lot_size:
        description: 'Only if the option is not in the plan: lot size'
        required: false
        default: ''
      price:
        description: 'Only if the option is not in the plan: approximate option price'
        required: false
        default: ''
      hold_s:
        description: 'roundtrip: seconds to hold before selling'
        required: false
        default: '15'
      dry_run:
        description: '1 = print only, send nothing'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: shapelive-kite-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp

      - name: Run test
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ORDER_PROXY: ${{ secrets.ORDER_PROXY }}
          TEST_OPTION: ${{ github.event.inputs.option }}
          TEST_LOT: ${{ github.event.inputs.lot_size }}
          TEST_PRICE: ${{ github.event.inputs.price }}
          HOLD_S: ${{ github.event.inputs.hold_s }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "iptest" ]; then
            python -u shape_live_manager.py iptest
          else
            python -u shape_live_test.py ${{ github.event.inputs.mode }}
          fi
