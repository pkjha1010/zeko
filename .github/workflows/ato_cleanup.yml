name: ATO Cleanup

on:
  schedule:
    - cron: '40 5 * * 1-5'   # TEST 11:10 AM IST
    - cron: '50 5 * * 1-5'   # TEST 11:20 AM IST
    - cron: '0 6 * * 1-5'    # TEST 11:30 AM IST
    - cron: '7 4 * * 1-5'    # 9:37 AM IST
    - cron: '27 4 * * 1-5'   # 9:57 AM IST
    - cron: '47 4 * * 1-5'   # 10:17 AM IST
    - cron: '17 5 * * 1-5'   # 10:47 AM IST
    - cron: '30 4 * * 1-5'   # 10:00 AM IST, Mon-Fri
    - cron: '45 4 * * 1-5'   # 10:15 AM IST, Mon-Fri
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp

      - name: Run ATO cleanup
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
        run: python run_ato_cleanup.py
        
