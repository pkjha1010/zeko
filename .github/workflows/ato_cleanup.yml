name: Daily Zerodha ATO Cleanup

# Controls when the action will run
on:
  schedule:
    # 04:30 UTC converts exactly to 10:00 AM Indian Standard Time (IST)
    # Runs Monday through Friday every week
    - cron: '30 4 * * 1-5'  
  workflow_dispatch: 
    # Allows you to manually click the "Run workflow" button in GitHub to test it immediately

jobs:
  cleanup:
    name: Execute ATO Cleanup Script
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Clone your repository files into the runner machine
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Install and configure Python 3.10
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install all required external packages including pyotp
      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests kiteconnect pyotp

      # Step 4: Run the clean up script and pass your stored GitHub Secrets as environment variables
      - name: Run Script
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
        run: python run_ato_cleanup.py
        
