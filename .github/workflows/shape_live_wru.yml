name: 'SHAPELIVE WRU (start ~08:40 IST: plan -> ATO alerts at once -> manager to 09:45 - wick-red-upper short, SL 20, no target, entries to 09:30, exit 09:30)'

# MORNING job - start it ONCE per day with cron-job.org at about 08:40 IST (Mon-Fri), BEFORE the BPB job of 11:45 (shape_live_manager.yml).
# ONE job, two steps: 1. plan = find the WRU setups, create the ATO alerts at once (no untouched check - the market is not open yet);  2. manager = stop-loss watching, 09:30 square-off, clean-up.
# It ends by 09:45 and shares the concurrency group with the BPB job, so the two never overlap.  Angel One candle download can take 10+ minutes: start early enough for the alerts to exist by 09:15.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = normal day | cleanup = delete all waiting SHP| alerts right now | iptest = check the static IP (places nothing)'
        required: false
        default: 'run'
      dry_run:
        description: '1 = print the plan and the orders, create/send nothing'
        required: false
        default: '0'
      capital_pct:
        description: 'Each WRU trade may use this percent of the funds available in your Kite account'
        required: false
        default: '7'
      min_price:
        description: 'Options priced at or below this many rupees are not traded (Rs 5 = a Rs 5.00 option is excluded)'
        required: false
        default: '5'
      total_funds:
        description: 'OPTIONAL total funds in rupees: trades are sized on this instead of the funds available in Kite (blank = use Kite)'
        required: false
        default: ''
      max_cost:
        description: 'OPTIONAL fixed rupee cap per trade. Leave empty to use the percentage above'
        required: false
        default: ''
      fund_limit_pct:
        description: '0 = no fund limit (default).  30 = no new orders while the account uses more than 30 percent of the total funds'
        required: false
        default: '0'
      sweep_all:
        description: '0 (default) = only the options of the plan + SHP orders | 1 = after 15:30 also clear EVERY open NFO position and waiting NFO order of the account'
        required: false
        default: '0'
      force:
        description: '0 (default). 1 = allow the plan outside the normal window (weekend / after 15:00)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: shapelive-kite-manager
  cancel-in-progress: false

jobs:
  wru:
    name: 'plan before the open + manager to 09:45'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp pandas numpy

      - name: Plan - scan WRU setups, create ATO alerts at once
        id: plan
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'run' }}
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
          STRATEGIES: 'WRU'
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          WRU_CAPITAL_PCT: ${{ github.event.inputs.capital_pct || '7' }}
          MIN_PRICE: ${{ github.event.inputs.min_price || '5' }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
          MAX_COST: ${{ github.event.inputs.max_cost }}
          FORCE: ${{ github.event.inputs.force }}
        run: python -u shape_live_plan.py plan

      - name: Manage entries, stop-loss, 09:30 square-off and clean-up
        # runs even if the plan step ended with an error after creating some alerts; with a failed plan there is no plan for today and the manager stops by itself
        if: ${{ !cancelled() }}
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ORDER_PROXY: ${{ secrets.ORDER_PROXY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FUND_LIMIT_PCT: ${{ github.event.inputs.fund_limit_pct }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
          SWEEP_ALL: ${{ github.event.inputs.sweep_all }}
          PLAN_FILE: ${{ github.event.inputs.dry_run == '1' && 'live_plan/preview.json' || 'live_plan/plan.json' }}
          JOB_END: '09:45:00'
          FINAL_END: '09:45:00'
        run: python -u shape_live_manager.py ${{ github.event.inputs.mode || 'run' }}
