name: 'SHAPELIVE manager (08:55-15:45 IST - WRU + BPB: entries, stop-loss, target, square-off, BPB max 3 open)'

# Start it ONCE per day (cron-job.org 08:55).  Two chained jobs because GitHub stops one job after 6 hours:
#   morning    runs until 12:58:00 and ends quietly (hand-over)
#   afternoon  starts the moment the morning job has finished (needs: morning) and runs to 15:45:00; it must end CLEAN or the run fails and you get the mail.
# If the run is started late (e.g. 13:30 after a crash) the morning job does nothing and the afternoon job takes over at once.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = normal day | cleanup = delete all waiting SHP| alerts right now | iptest = check the static IP (places nothing)'
        required: false
        default: 'run'
      job_end:
        description: 'End time of the MORNING job (hand-over to the afternoon job). Leave as 12:58:00'
        required: false
        default: '12:58:00'
      dry_run:
        description: '1 = print the orders, send nothing'
        required: false
        default: '0'
      fund_limit_pct:
        description: '0 = no fund limit (default).  30 = no new orders while the account uses more than 30 percent of the total funds'
        required: false
        default: '0'
      total_funds:
        description: 'OPTIONAL total funds in rupees for the fund limit (blank = Kite net balance + used funds)'
        required: false
        default: ''
      sweep_all:
        description: '0 (default) = only the options of the plan + SHP orders | 1 = after the last strategy also clear EVERY open NFO position and waiting NFO order of the account'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: shapelive-kite-manager
  cancel-in-progress: false

jobs:
  morning:
    name: 'morning job (to 12:58, hand-over)'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp

      - name: Manage entries, targets, stop-loss, exits and the open-trade limit
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ORDER_PROXY: ${{ secrets.ORDER_PROXY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FUND_LIMIT_PCT: ${{ github.event.inputs.fund_limit_pct }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
          SWEEP_ALL: ${{ github.event.inputs.sweep_all }}
          JOB_END: ${{ github.event.inputs.job_end || '12:58:00' }}
        run: python -u shape_live_manager.py ${{ github.event.inputs.mode || 'run' }}

  afternoon:
    name: 'afternoon job (from the hand-over to 15:45)'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    needs: morning
    if: ${{ !cancelled() && (github.event.inputs.mode == '' || github.event.inputs.mode == 'run') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp

      - name: Manage entries, targets, stop-loss, exits and the open-trade limit
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ORDER_PROXY: ${{ secrets.ORDER_PROXY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FUND_LIMIT_PCT: ${{ github.event.inputs.fund_limit_pct }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
          SWEEP_ALL: ${{ github.event.inputs.sweep_all }}
          JOB_END: '15:45:00'
        run: python -u shape_live_manager.py ${{ github.event.inputs.mode || 'run' }}
