name: SHAPELIVE manager (morning - entries to 09:25, square off 09:30, clean-up)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = normal morning job | cleanup = delete all waiting SHP| alerts right now | iptest = check the static IP (places nothing)'
        required: false
        default: 'run'
      dry_run:
        description: '1 = print the orders, send nothing'
        required: false
        default: '0'
      entry_end:
        description: 'Entries stop at this time: waiting ATO alerts are deleted and waiting BUY orders cancelled (09:26:00 = entries through 09:25:59)'
        required: false
        default: '09:26:00'
      sweep_all:
        description: '1 (default) = at 09:30 clear EVERY open NFO position and waiting NFO order of the account | 0 = only this strategy (plan options, SHP orders and alerts)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: shapelive-kite-manager
  cancel-in-progress: false

jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp

      - name: Manage entries, stop-loss and exits
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ORDER_PROXY: ${{ secrets.ORDER_PROXY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ENTRY_END: ${{ github.event.inputs.entry_end }}
          SWEEP_ALL: ${{ github.event.inputs.sweep_all }}
        run: python -u shape_live_manager.py ${{ github.event.inputs.mode }}
