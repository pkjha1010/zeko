name: 'SHAPELIVE BPB (start ~11:45 IST: plan -> ATO alerts at 12:00 -> manager to 15:45 - breakout short, target 60, no SL, exit 15:30, max 2 open)'

# Start it ONCE per day with cron-job.org at 11:45 IST (Mon-Fri).  ONE job, two steps (same machine, so the plan file is shared - nothing is committed):
#   1. plan     finds the BPB setups, waits for 12:00:00, drops every setup whose entry level was touched since 09:15, creates the ATO alerts, writes live_plan/plan.json
#   2. manager  starts right after: stop-loss/target watching, 15:30 square-off, max 2 open trades, clean-up; ends 15:45:00 (fails = mail if something is left)
# Because the job runs only ~4 hours (< 6 h GitHub limit) the old morning/afternoon hand-over is not needed any more.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = normal day | cleanup = delete all waiting SHP| alerts right now | iptest = check the static IP (places nothing)'
        required: false
        default: 'run'
      dry_run:
        description: '1 = print the plan and the orders, create/send nothing'
        required: false
        default: '0'
      capital_pct:
        description: 'Each trade may use this percent of the funds available in your Kite account (max 15)'
        required: false
        default: '15'
      bpb_max_open:
        description: 'The most BPB trades open at the same time'
        required: false
        default: '2'
      min_price:
        description: 'Options priced below this many rupees are not traded'
        required: false
        default: '2'
      alert_at:
        description: 'Time the ATO alerts are created (the untouched-since-open check is made at this second)'
        required: false
        default: '12:00:00'
      total_funds:
        description: 'OPTIONAL total funds in rupees: trades are sized on this instead of the funds available in Kite (blank = use Kite)'
        required: false
        default: ''
      max_cost:
        description: 'OPTIONAL fixed rupee cap per trade. Leave empty to use the percentage above'
        required: false
        default: ''
      fund_limit_pct:
        description: '0 = no fund limit (default).  30 = no new orders while the account uses more than 30 percent of the total funds'
        required: false
        default: '0'
      sweep_all:
        description: '0 (default) = only the options of the plan + SHP orders | 1 = after 15:30 also clear EVERY open NFO position and waiting NFO order of the account'
        required: false
        default: '0'
      force:
        description: '0 (default). 1 = allow the plan outside the normal window (weekend / after 15:00)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: shapelive-kite-manager
  cancel-in-progress: false

jobs:
  bpb:
    name: 'plan 12:00 + manager to 15:45'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp pandas numpy

      - name: Plan - scan, drop touched setups, create ATO alerts at 12:00
        id: plan
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'run' }}
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
          STRATEGIES: 'BPB'
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CAPITAL_PCT: ${{ github.event.inputs.capital_pct || '15' }}
          BPB_MAX_OPEN: ${{ github.event.inputs.bpb_max_open || '2' }}
          MIN_PRICE: ${{ github.event.inputs.min_price || '2' }}
          ALERT_AT: ${{ github.event.inputs.alert_at || '12:00:00' }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
          MAX_COST: ${{ github.event.inputs.max_cost }}
          FORCE: ${{ github.event.inputs.force }}
        run: python -u shape_live_plan.py plan

      - name: Manage entries, targets, exits, 15:30 square-off and the open-trade limit
        # runs even if the plan step ended with an error after creating some alerts; with a failed plan there is no plan for today and the manager stops by itself
        if: ${{ !cancelled() }}
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ORDER_PROXY: ${{ secrets.ORDER_PROXY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FUND_LIMIT_PCT: ${{ github.event.inputs.fund_limit_pct }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
          SWEEP_ALL: ${{ github.event.inputs.sweep_all }}
          PLAN_FILE: ${{ github.event.inputs.dry_run == '1' && 'live_plan/preview.json' || 'live_plan/plan.json' }}
          JOB_END: '15:45:00'
        run: python -u shape_live_manager.py ${{ github.event.inputs.mode || 'run' }}
