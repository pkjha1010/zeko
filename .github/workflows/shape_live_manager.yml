name: SHAPELIVE manager (09:00-15:45 IST - entries, targets, stop-loss, per-strategy square-off, 30 % fund limit)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = normal day job | cleanup = delete all waiting SHP| alerts right now | iptest = check the static IP (places nothing)'
        required: false
        default: 'run'
      job_end:
        description: 'This job stops at this time (IST). 12:58:00 = the MORNING job (hands over to the next one) | 15:45:00 = the AFTERNOON job (must end clean)'
        required: false
        default: '15:45:00'
      dry_run:
        description: '1 = print the orders, send nothing'
        required: false
        default: '0'
      fund_limit_pct:
        description: 'No new orders while the account uses more than this percent of the total funds'
        required: false
        default: '30'
      total_funds:
        description: 'OPTIONAL total funds in rupees for the limit (blank = Kite net balance + used funds)'
        required: false
        default: ''
      sweep_all:
        description: '0 (default) = only the options of the plan + SHP orders | 1 = after the last strategy also clear EVERY open NFO position and waiting NFO order of the account'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: shapelive-kite-manager
  cancel-in-progress: false

jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp

      - name: Manage entries, targets, stop-loss, exits and the fund limit
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ORDER_PROXY: ${{ secrets.ORDER_PROXY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          JOB_END: ${{ github.event.inputs.job_end }}
          FUND_LIMIT_PCT: ${{ github.event.inputs.fund_limit_pct }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
          SWEEP_ALL: ${{ github.event.inputs.sweep_all }}
        run: python -u shape_live_manager.py ${{ github.event.inputs.mode || 'run' }}
