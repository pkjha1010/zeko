name: 'GAPLIVE preview - run in the EVENING after the market closes (e.g. 18:00 IST): next trading day setups, nothing is traded'

# Start it with cron-job.org at 18:00 IST (Mon-Fri; Sunday too for Monday).  It creates NO alerts and changes NO plan.
# Result: the run page (Summary tab) shows a table of next day's GAP LONG / GAP SHORT setups, entry levels, options (nearest strike), lots and cost; the list is also attached as the artifact "preview".
# GAP SHORT's untouched-since-open check can only be made on the day itself (09:30), so a listed short may still be dropped.
on:
  workflow_dispatch:
    inputs:
      strategies:
        description: 'GAPL,GAPS (default) = both'
        required: false
        default: 'GAPL,GAPS'
      total_funds:
        description: 'OPTIONAL total funds in rupees for the lot calculation (blank = funds available in Kite now)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gaplive-preview
  cancel-in-progress: false

jobs:
  preview:
    name: 'next day preview'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests kiteconnect pyotp pandas numpy
      - name: Preview - scan, choose options, list next day setups
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
          STRATEGIES: ${{ github.event.inputs.strategies || 'GAPL,GAPS' }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
        run: python -u gap_live_plan.py preview
      - name: Attach the preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: live_plan/preview_next_*.json
          if-no-files-found: ignore
