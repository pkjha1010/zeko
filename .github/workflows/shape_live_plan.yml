name: SHAPELIVE plan (06:00 IST - creates ATO alerts for WICK_RED_LOWER, WICK_RED_UPPER and BREAKOUT_BPB)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = create the alerts | probe = print your existing ATO alerts (to check the GTT target / stop-loss layout)'
        required: false
        default: 'plan'
      dry_run:
        description: '1 = show the plan only, create no alerts'
        required: false
        default: '0'
      strategies:
        description: 'WRL,WRU,BPB = all three (default) | any subset, e.g. WRU,BPB.  WRL = WICK_RED_LOWER long (exit 10:00) | WRU = WICK_RED_UPPER short (SL 20, exit 09:30) | BPB = breakout short (exit 15:30)'
        required: false
        default: 'WRL,WRU,BPB'
      min_price:
        description: 'Options priced below this many rupees are not traded'
        required: false
        default: '2'
      capital_pct:
        description: 'Each trade may use this percent of the funds available in your Kite account'
        required: false
        default: '10'
      total_funds:
        description: 'OPTIONAL total funds in rupees: trades are sized on this instead of the funds available in Kite (blank = use Kite)'
        required: false
        default: ''
      max_cost:
        description: 'OPTIONAL fixed rupee cap per trade. Leave empty to use the percentage above'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: shapelive-kite
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp pandas numpy

      - name: Scan, choose options, create ATO alerts
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_COST: ${{ github.event.inputs.max_cost }}
          CAPITAL_PCT: ${{ github.event.inputs.capital_pct }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
          STRATEGIES: ${{ github.event.inputs.strategies }}
          MIN_PRICE: ${{ github.event.inputs.min_price }}
        run: python -u shape_live_plan.py ${{ github.event.inputs.mode || 'plan' }}

      - name: Save plan
        if: always()
        run: |
          git config user.name "shapelive-bot"
          git config user.email "shapelive-bot@users.noreply.github.com"
          if [ -d live_plan ]; then git add live_plan; fi
          git diff --cached --quiet || git commit -m "shapelive plan"
          git pull --no-rebase -X ours --no-edit || true
          git push || true
