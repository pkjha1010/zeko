name: 'SHAPELIVE plan (run once, after market close e.g. 18:00 - plans the NEXT trading day and creates the ATO alerts)'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = create the alerts | probe = print your existing ATO alerts (to check the GTT target / stop-loss layout)'
        required: false
        default: 'plan'
      dry_run:
        description: '1 = show the plan only, create no alerts, do not change plan.json'
        required: false
        default: '0'
      strategies:
        description: 'WRU,BPB (default) | WRU = WICK_RED_UPPER short (SL 20, no target, exit 09:30) | BPB = breakout short (target 60, exit 15:30, max 3 open) | WRL also possible'
        required: false
        default: 'WRU,BPB'
      min_price:
        description: 'Options priced below this many rupees are not traded'
        required: false
        default: '2'
      capital_pct:
        description: 'Each trade may use this percent of the funds available in your Kite account'
        required: false
        default: '10'
      total_funds:
        description: 'OPTIONAL total funds in rupees: trades are sized on this instead of the funds available in Kite (blank = use Kite)'
        required: false
        default: ''
      max_cost:
        description: 'OPTIONAL fixed rupee cap per trade. Leave empty to use the percentage above'
        required: false
        default: ''
      force:
        description: '0 (default). 1 = allow a run during market hours (it plans the next trading day)'
        required: false
        default: '0'
      bpb_max_open:
        description: 'BPB (no stop-loss): the most trades open at the same time'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: shapelive-kite
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests kiteconnect pyotp pandas numpy

      - name: Scan, choose options, create ATO alerts
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_KEY: ${{ secrets.ZERODHA_TOTP_KEY }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_COST: ${{ github.event.inputs.max_cost }}
          CAPITAL_PCT: ${{ github.event.inputs.capital_pct }}
          TOTAL_FUNDS: ${{ github.event.inputs.total_funds }}
          STRATEGIES: ${{ github.event.inputs.strategies }}
          MIN_PRICE: ${{ github.event.inputs.min_price }}
          FORCE: ${{ github.event.inputs.force }}
          BPB_MAX_OPEN: ${{ github.event.inputs.bpb_max_open }}
        run: python -u shape_live_plan.py ${{ github.event.inputs.mode || 'plan' }}

      - name: Save plan
        if: always()
        run: |
          git config user.name "shapelive-bot"
          git config user.email "shapelive-bot@users.noreply.github.com"
          if [ -d live_plan ]; then git add live_plan; fi
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "shapelive plan"
          for i in 1 2 3 4 5; do
            git pull --no-rebase -X ours --no-edit && git push && echo "plan pushed" && exit 0
            echo "push attempt $i failed - retrying"; sleep 5
          done
          echo "!!! THE PLAN FILE COULD NOT BE PUSHED - the manager would not see it"; exit 1
